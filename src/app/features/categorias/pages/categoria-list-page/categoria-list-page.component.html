<div class="page-container categoria-page">
  <app-page-header
    title="Categorias"
    subtitle="Cadastre, organize e mantenha as categorias usadas nos produtos do estoque."
  >
    <button type="button" mat-flat-button color="primary" class="btn-primary" (click)="novaCategoria()">
      <mat-icon>add</mat-icon>
      Nova Categoria
    </button>
  </app-page-header>

  <div class="categoria-page__grid">
    <section class="table-card categoria-page__table">
      <div class="categoria-page__filters">
        <mat-form-field appearance="outline" class="categoria-page__search">
          <mat-label>Buscar categoria</mat-label>
          <input
            matInput
            [formControl]="termoControl"
            placeholder="Pesquise por nome ou descrição"
            (keyup.enter)="pesquisar()"
          />
          <button
            *ngIf="termoControl.value"
            type="button"
            mat-icon-button
            matSuffix
            (click)="limparFiltros()"
            aria-label="Limpar busca"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <div class="categoria-page__filter-actions">
          <button type="button" mat-stroked-button class="btn-secondary" (click)="pesquisar()">
            Pesquisar
          </button>
          <button type="button" mat-button class="btn-ghost" (click)="limparFiltros()">
            Limpar
          </button>
        </div>
      </div>

      <p *ngIf="erroMensagem" class="categoria-page__error">{{ erroMensagem }}</p>

      <app-loading *ngIf="loading" message="Carregando categorias..."></app-loading>

      <ng-container *ngIf="!loading">
        <app-empty-state
          *ngIf="categorias.length === 0"
          icon="📂"
          title="Nenhuma categoria encontrada"
          description="Ajuste os filtros ou crie uma nova categoria para começar."
        >
          <button type="button" mat-flat-button color="primary" class="btn-primary" (click)="novaCategoria()">
            Nova Categoria
          </button>
        </app-empty-state>

        <app-categoria-table
          *ngIf="categorias.length > 0"
          [categorias]="categorias"
          [totalElements]="totalElements"
          [pageIndex]="filter.page"
          [pageSize]="filter.size"
          (editar)="editarCategoria($event)"
          (excluir)="excluirCategoria($event)"
          (pageChange)="onPageChange($event)"
        ></app-categoria-table>
      </ng-container>
    </section>

    <aside class="form-card categoria-page__form" *ngIf="showForm">
      <app-categoria-form
        [categoriaSelecionada]="categoriaSelecionada"
        [saving]="saving"
        (saved)="salvarCategoria($event)"
        (cancelled)="cancelarFormulario()"
      ></app-categoria-form>
    </aside>
  </div>

  <div *ngIf="confirmandoExclusao" class="categoria-page__dialog-backdrop">
    <app-confirm-dialog
      title="Excluir categoria"
      [message]="'Deseja realmente excluir a categoria ' + (categoriaParaExcluir?.nome ?? '') + '?'"
      confirmLabel="Excluir"
      cancelLabel="Cancelar"
      [danger]="true"
      (confirmed)="confirmarExclusao()"
      (cancelled)="cancelarExclusao()"
    ></app-confirm-dialog>
  </div>
</div>
